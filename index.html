<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MM AutoLink</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1>MM AutoLink</h1>
    <p>Vehicle Management System</p>
  </header>

  <main class="container">

    <h2>Dashboard</h2>

    <section class="dashboard">

      <div class="card">
        <h3>Total Vehicles</h3>
        <p id="totalVehicles">0</p>
      </div>

      <div class="card">
        <h3>Total Purchases</h3>
        <p id="totalPurchases">₹0</p>
      </div>

      <div class="card">
        <h3>Total Sales</h3>
        <p id="totalSales">₹0</p>
      </div>

      <div class="card">
        <h3>Profit</h3>
        <p id="totalProfit">₹0</p>
      </div>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
